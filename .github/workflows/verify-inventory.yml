name: Verify live inventory module

# Manually-triggerable check that walks inventory routes on the live site and
# confirms the latest sql/migrate_*.sql in this checkout is applied.
# Prefer the Deploy workflow's step 3/3 for day-to-day gates — this is a
# lighter on-demand probe when you only care about inventory + migrate.
on:
  workflow_dispatch:

jobs:
  verify:
    name: Probe live inventory routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1/3 — /last-migrate.log must show latest migration applied
        run: |
          set -euo pipefail
          BASE=https://mtt.thelittlegraduates.in
          LAST_MIG=$(ls sql/migrate_*.sql | sort | tail -1 | xargs basename)
          echo "--- expecting $LAST_MIG ---"
          echo "--- fetching last-migrate.log ---"
          LOG=$(curl -sS --fail-with-body --max-time 30 "$BASE/last-migrate.log") \
              || { echo "::error::could not fetch last-migrate.log"; exit 1; }
          echo "$LOG" | tail -120
          echo "--- checks ---"
          if echo "$LOG" | grep -qE "FAILED"; then
              echo "::error::migration run reported a failure"
              exit 1
          fi
          if ! echo "$LOG" | grep -q "$LAST_MIG"; then
              echo "::error::$LAST_MIG not mentioned in last-migrate.log"
              exit 1
          fi
          if ! echo "$LOG" | awk -v f="$LAST_MIG" 'index($0, f){found=1; next} found && /applied/{ok=1; exit} found && /───/{exit} END{exit !ok}'; then
              echo "::error::$LAST_MIG line not followed by 'applied'"
              exit 1
          fi
          echo "::notice::Migration $LAST_MIG ✓ applied on the live DB"

      - name: 2/3 — every inventory route returns non-500
        run: |
          set -euo pipefail
          BASE=https://mtt.thelittlegraduates.in
          fail=0
          for path in \
              "/inventory/index.php" \
              "/inventory/index.php?view=low" \
              "/inventory/index.php?view=due" \
              "/inventory/index.php?view=attention" \
              "/inventory/index.php?format=csv" \
              "/inventory/edit.php" \
              "/inventory/reports.php"; do
              S=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 20 "$BASE$path")
              echo "  $S  $path"
              if [ "$S" = "500" ] || [ "$S" = "502" ] || [ "$S" = "503" ]; then
                  echo "::error::$path returned $S"
                  echo "--- response body ---"
                  head -c 800 /tmp/body
                  fail=1
              fi
              if grep -q "Something went wrong" /tmp/body 2>/dev/null; then
                  echo "::error::$path rendered the friendly error page"
                  fail=1
              fi
          done
          [ $fail -eq 0 ] || exit 1
          echo "::notice::All inventory routes responded without server errors"

      - name: 3/3 — non-auth'd hits should redirect to login
        run: |
          set -euo pipefail
          BASE=https://mtt.thelittlegraduates.in
          LOC=$(curl -sS -o /dev/null -w "%{http_code} %{redirect_url}" --max-time 20 "$BASE/inventory/index.php")
          echo "  $LOC"
          STATUS=${LOC%% *}
          REDIR=${LOC#* }
          if [ "$STATUS" = "302" ] && echo "$REDIR" | grep -q "/login.php"; then
              echo "::notice::Inventory page bootstraps and routes to login as expected"
          elif [ "$STATUS" = "200" ]; then
              echo "::notice::Inventory page returned 200 — manual UI check still recommended."
          else
              echo "::error::unexpected status/redirect: $LOC"
              exit 1
          fi
