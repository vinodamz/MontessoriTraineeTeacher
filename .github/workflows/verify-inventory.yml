name: Verify live deployment (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only revision, migration, bootstrap and access checks
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/verify-deploy.py --sha "$EXPECTED_SHA"
