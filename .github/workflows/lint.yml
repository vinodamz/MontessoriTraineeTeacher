name: PHP lint

# Runs on every push to a branch and every pull request — gives PRs an
# explicit green/red signal so we know it's safe to merge to main (which
# triggers the deploy workflow).

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  lint:
    name: php -l on every .php file
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: mtt_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql
          tools: none
      - name: php -l
        run: |
          set -e
          find . -path ./.git -prune -o -name '*.php' -print | while read -r f; do
            php -l "$f" >/dev/null
          done
      - name: Workspace security and CORS regression tests
        run: |
          php tests/api_cors_test.php
          php tests/app_workspace_test.php
      - name: Assessment rating round-trip and comment carry-forward
        env:
          ASSESSMENT_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=mtt_test
          ASSESSMENT_TEST_USER: root
          ASSESSMENT_TEST_PASSWORD: test
        run: php tests/assessment_rating_test.php
