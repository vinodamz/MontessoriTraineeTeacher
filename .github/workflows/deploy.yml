name: Configure app deployment credentials
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - run: python3 -m pip install pynacl
      - name: Seal cPanel credentials to the app repository public key
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import os, json, base64
          from nacl.public import PublicKey, SealedBox
          key = {'key_id': '3380204578043523366', 'key': 'x7VCkUL7jOK3qHkwvSut0BC3vAcBLhfth2cFaPvl0lw='}
          box = SealedBox(PublicKey(base64.b64decode(key['key'])))
          output = {name: {'key_id': key['key_id'], 'encrypted_value': base64.b64encode(box.encrypt(os.environ[name].encode())).decode()} for name in ['CPANEL_HOST', 'CPANEL_USER', 'CPANEL_TOKEN']}
          with open('sealed-deployment.json', 'w') as file: json.dump(output, file)
          print('Deployment credentials sealed for LittleGraduatesApp; no plaintext exported.')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-app-deployment
          path: sealed-deployment.json
          retention-days: 1
