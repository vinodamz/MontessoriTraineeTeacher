name: Inspect app hosting readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect cPanel domains without changing hosting
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, socket
          host = os.environ['CPANEL_HOST'].removeprefix('https://').removeprefix('http://').rstrip('/').split(':')[0]
          def api(module, function, **params):
              url = 'https://' + host + ':2083/execute/' + module + '/' + function + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'Authorization': 'cpanel ' + os.environ['CPANEL_USER'] + ':' + os.environ['CPANEL_TOKEN']})
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)
          data = api('DomainInfo', 'list_domains')
          print('Domain API status:', data.get('status'))
          if data.get('status') != 1:
              print('Could not inspect this cPanel account.'); raise SystemExit(1)
          domains = data.get('data') or {}
          all_domains = [domains.get('main_domain', '')] + domains.get('addon_domains', []) + domains.get('sub_domains', []) + domains.get('parked_domains', [])
          for name in ['thelittlegraduates.in', 'mtt.thelittlegraduates.in', 'app.thelittlegraduates.in']:
              print(name, 'configured:', name in all_domains)
              if name in all_domains:
                  result = api('DomainInfo', 'single_domain_data', domain=name)
                  domain = result.get('data') or {}
                  print('Document root:', domain.get('documentroot', 'not reported'))
          try:
              print('App DNS points to cPanel server:', socket.gethostbyname('app.thelittlegraduates.in') == socket.gethostbyname(host))
          except OSError:
              print('DNS comparison unavailable')
          PY
